name: Compilar APK Android
on:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: read
  id-token: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      # Opcional: activar cuando existan ambas variables de repositorio.
      # GCP_WORKLOAD_IDENTITY_PROVIDER: ruta completa del proveedor.
      # GCP_SERVICE_ACCOUNT: correo de la cuenta de servicio autorizada.
      - name: Autenticar con Google Cloud mediante OIDC
        if: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER != '' && vars.GCP_SERVICE_ACCOUNT != '' }}
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}
      - name: Build APK
        run: gradle :app:assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: BusElectrico-IslaDeMaipo-APK
          path: app/build/outputs/apk/debug/app-debug.apk

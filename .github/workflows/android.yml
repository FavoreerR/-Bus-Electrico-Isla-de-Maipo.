name: Compilar APK Android
on:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build APK
        run: gradle :app:assembleDebug --no-daemon
      - name: Prepare public release APK
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk dist/BusElectrico-IslaDeMaipo.apk
          sha256sum dist/BusElectrico-IslaDeMaipo.apk > dist/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: BusElectrico-IslaDeMaipo-APK
          path: dist/*
      - name: Publish public GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: bus-v1.0.${{ github.run_number }}
          name: Bus Eléctrico Isla de Maipo v1.0.${{ github.run_number }}
          body: |
            APK Android para pasajeros.

            Descarga: `BusElectrico-IslaDeMaipo.apk`
            SHA-256: `SHA256SUMS.txt`
          files: |
            dist/BusElectrico-IslaDeMaipo.apk
            dist/SHA256SUMS.txt
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

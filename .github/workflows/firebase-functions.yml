name: Deploy Firebase Push Notifications
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
          project_id: bus-isla-de-maipo
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --prefix functions --no-audit --no-fund
      - run: npx --yes firebase-tools@15.34.1 deploy --only functions --project bus-isla-de-maipo --non-interactive

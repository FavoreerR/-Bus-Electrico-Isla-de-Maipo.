name: Deploy Firebase Push Notifications
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'functions/**'
      - '.github/workflows/firebase-functions.yml'
permissions:
  contents: read
  id-token: write
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}
          project_id: bus-isla-de-maipo
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --prefix functions --no-audit --no-fund
      - run: npx --yes firebase-tools@15.34.1 deploy --only functions --project bus-isla-de-maipo --non-interactive

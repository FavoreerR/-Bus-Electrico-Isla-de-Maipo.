name: Deploy Firebase Firestore Rules

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'firestore.rules'
      - 'firebase.json'
      - '.firebaserc'
      - '.github/workflows/firebase-deploy.yml'

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --prefix functions --no-audit --no-fund
      - name: Deploy Firestore rules with Firebase Admin SDK
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const admin = require('./functions/node_modules/firebase-admin');
          const credentials = JSON.parse(process.env.FIREBASE_SERVICE_ACCOUNT_JSON || '{}');
          if (credentials.project_id !== 'bus-isla-de-maipo') {
            throw new Error('FIREBASE_SERVICE_ACCOUNT_JSON must belong to bus-isla-de-maipo.');
          }
          admin.initializeApp({
            credential: admin.credential.cert(credentials),
            projectId: 'bus-isla-de-maipo'
          });
          admin.securityRules()
            .releaseFirestoreRulesetFromSource(fs.readFileSync('firestore.rules', 'utf8'))
            .then(() => console.log('Firestore rules deployed successfully.'))
            .catch(error => {
              console.error('Firestore rules deployment failed:', error.message);
              process.exitCode = 1;
            });
          NODE

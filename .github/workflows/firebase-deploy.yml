name: Deploy Firebase Firestore Rules

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'firestore.rules'
      - 'firebase.json'
      - '.firebaserc'
      - '.github/workflows/firebase-deploy.yml'

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
          project_id: bus-isla-de-maipo
      - uses: google-github-actions/setup-gcloud@v2
      - name: Deploy Firestore rules
        run: |
          npx --yes firebase-tools@15.34.1 deploy --only firestore:rules --project bus-isla-de-maipo --non-interactive
